[package]
name = "Copy_ManGa_downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.71"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = [
    "stream",
    "rustls-tls",
    "charset",
    "http2",
    "cookies",
    "macos-system-configuration",
] }
serde = { version = "1.0", features = ["derive"] } 
serde_json = "1.0"
hex = "0.4"
cbc = "0.1"
aes = "0.8"
indicatif = "0.17.6"
futures = "0.3.32"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "signal", "io-util", "io-std", "macros"] }
regex = "1.13.1"
scraper = "0.20"







[profile.release]
lto = true        # 启用链接时优化，体积更小，速度更快
strip = true      # 自动去除符号表 (显著减小体积)



